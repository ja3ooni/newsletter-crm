version: '3.8'

services:
  # Redis for caching tests
  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for database tests
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: developer_tools_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/__tests__/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d developer_tools_test']
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for document tests
  mongo-test:
    image: mongo:6-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: test_user
      MONGO_INITDB_ROOT_PASSWORD: test_password
      MONGO_INITDB_DATABASE: developer_tools_test
    ports:
      - '27018:27017'
    volumes:
      - mongo-test-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for search tests
  elasticsearch-test:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9201:9200'
    volumes:
      - elasticsearch-test-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  # Mock API server for integration tests
  mock-api:
    image: mockserver/mockserver:5.15.0
    ports:
      - '1081:1080'
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
    volumes:
      - ./scripts/__tests__/fixtures/mockserver.properties:/config/mockserver.properties
      - ./scripts/__tests__/fixtures/mock-expectations.json:/config/expectations.json
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:1080/mockserver/status || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test runner service
  test-runner:
    build:
      context: ./scripts
      dockerfile: Dockerfile.test
    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      mongo-test:
        condition: service_healthy
      elasticsearch-test:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis-test:6379
      DATABASE_URL: postgresql://test_user:test_password@postgres-test:5432/developer_tools_test
      MONGODB_URL: mongodb://test_user:test_password@mongo-test:27017/developer_tools_test
      ELASTICSEARCH_URL: http://elasticsearch-test:9200
      MOCK_API_URL: http://mock-api:1080
    volumes:
      - ./scripts:/app
      - /app/node_modules
    working_dir: /app
    command: npm run test:integration:full

volumes:
  redis-test-data:
  postgres-test-data:
  mongo-test-data:
  elasticsearch-test-data:

networks:
  default:
    name: developer-tools-test-network
