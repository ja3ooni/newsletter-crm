apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: datatechtoncrm
  labels:
    app: content-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
      - name: content-service
        image: datatechtoncrm/content-service:latest
        ports:
        - containerPort: 3003
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: datatechtoncrm-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: datatechtoncrm-config
              key: CONTENT_SERVICE_PORT
        - name: DATABASE_URL
          value: "postgresql://datatechtoncrm:$(POSTGRES_PASSWORD)@postgres-service:5432/content_db"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379"
        - name: RABBITMQ_URL
          value: "amqp://datatechtoncrm:$(RABBITMQ_PASSWORD)@rabbitmq-service:5672"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datatechtoncrm-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datatechtoncrm-secrets
              key: REDIS_PASSWORD
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datatechtoncrm-secrets
              key: RABBITMQ_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: datatechtoncrm
  labels:
    app: content-service
spec:
  selector:
    app: content-service
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: content-service-hpa
  namespace: datatechtoncrm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: content-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80