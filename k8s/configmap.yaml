apiVersion: v1
kind: ConfigMap
metadata:
  name: ailert-config
  namespace: ailert
data:
  # Database configuration
  POSTGRES_DB: "ailert"
  POSTGRES_USER: "ailert"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # RabbitMQ configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "ailert"
  
  # Elasticsearch configuration
  ELASTICSEARCH_URL: "http://elasticsearch-service:9200"
  
  # Service ports
  USER_SERVICE_PORT: "3001"
  NEWSLETTER_SERVICE_PORT: "3002"
  CONTENT_SERVICE_PORT: "3003"
  CRM_SERVICE_PORT: "3004"
  ANALYTICS_SERVICE_PORT: "3005"
  FRONTEND_PORT: "3000"
  
  # Environment
  NODE_ENV: "production"