---
# Health Check Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-checker
  namespace: datatechtoncrm-production
  labels:
    app: health-checker
    component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-checker
  template:
    metadata:
      labels:
        app: health-checker
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: health-checker-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: health-checker
          image: datatechtoncrm/health-checker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/etc/health-checker"
            - name: LOG_LEVEL
              value: "info"
            - name: METRICS_PORT
              value: "9090"
            - name: HTTP_PORT
              value: "8080"
            - name: CHECK_INTERVAL
              value: "30"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datatechtoncrm-secrets
                  key: ADMIN_TOKEN
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: health-check-config
              mountPath: /etc/health-checker
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: health-check-config
          configMap:
            name: health-check-config
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - health-checker
                topologyKey: kubernetes.io/hostname

---
# Health Checker Service
apiVersion: v1
kind: Service
metadata:
  name: health-checker-service
  namespace: datatechtoncrm-production
  labels:
    app: health-checker
    component: monitoring
spec:
  selector:
    app: health-checker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP

---
# Uptime Monitoring CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-monitor
  namespace: datatechtoncrm-production
  labels:
    app: uptime-monitor
    component: monitoring
spec:
  schedule: "*/5 * * * *" # Every 5 minutes
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: uptime-monitor
            component: monitoring
        spec:
          serviceAccountName: uptime-monitor-service-account
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          containers:
            - name: uptime-checker
              image: curlimages/curl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # External uptime checks
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

                  echo "Starting uptime checks at $TIMESTAMP"

                  # Check main website
                  if curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://datatechtoncrm.com | grep -q "200"; then
                    echo "✅ Main website is up"
                  else
                    echo "❌ Main website is down"
                    curl -X POST "$WEBHOOK_URL" \
                      -H "Content-Type: application/json" \
                      -d "{\"alert\": \"Website Down\", \"message\": \"Main website is not responding\", \"timestamp\": \"$TIMESTAMP\"}" || true
                  fi

                  # Check API endpoint
                  if curl -f -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.datatechtoncrm.com/health | grep -q "200"; then
                    echo "✅ API is up"
                  else
                    echo "❌ API is down"
                    curl -X POST "$WEBHOOK_URL" \
                      -H "Content-Type: application/json" \
                      -d "{\"alert\": \"API Down\", \"message\": \"API endpoint is not responding\", \"timestamp\": \"$TIMESTAMP\"}" || true
                  fi

                  # Check from multiple regions (if configured)
                  for region in us-east-1 us-west-2 eu-west-1; do
                    echo "Checking from region: $region"
                    # This would typically use a service like Pingdom, StatusCake, or AWS Route 53 health checks
                    # For now, we'll simulate with a simple curl
                    if curl -f -s -o /dev/null --max-time 15 "https://datatechtoncrm.com/?region=$region"; then
                      echo "✅ Region $region check passed"
                    else
                      echo "⚠️ Region $region check failed"
                    fi
                  done

                  echo "Uptime checks completed at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              env:
                - name: WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: datatechtoncrm-secrets
                      key: UPTIME_WEBHOOK_URL
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          restartPolicy: OnFailure

---
# Service Account for Health Checker
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-checker-service-account
  namespace: datatechtoncrm-production
  labels:
    component: monitoring

---
# Service Account for Uptime Monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-monitor-service-account
  namespace: datatechtoncrm-production
  labels:
    component: monitoring

---
# RBAC for Health Checker
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: health-checker-role
  namespace: datatechtoncrm-production
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: health-checker-role-binding
  namespace: datatechtoncrm-production
subjects:
  - kind: ServiceAccount
    name: health-checker-service-account
    namespace: datatechtoncrm-production
roleRef:
  kind: Role
  name: health-checker-role
  apiGroup: rbac.authorization.k8s.io

---
# ServiceMonitor for Prometheus to scrape health checker metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-checker-metrics
  namespace: datatechtoncrm-production
  labels:
    app: health-checker
    component: monitoring
spec:
  selector:
    matchLabels:
      app: health-checker
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
