          "method": "GET",
          "timeout": 5,
          "interval": 30,
          "retries": 3,
          "expected_status": 200,
          "critical": true
        },
        {
          "name": "newsletter-service",
          "url": "http://newsletter-service:3002/health",
          "method": "GET",
          "timeout": 5,
          "interval": 30,
          "retries": 3,
          "expected_status": 200,
          "critical": true
        },
        {
          "name": "crm-service",
          "url": "http://crm-service:3004/health",
          "method": "GET",
          "timeout": 5,
          "interval": 30,
          "retries": 3,
          "expected_status": 200,
          "critical": true
        },
        {
          "name": "analytics-service",
          "url": "http://analytics-service:3005/health",
          "method": "GET",
          "timeout": 5,
          "interval": 30,
          "retries": 3,
          "expected_status": 200,
          "critical": true
        },
        {
          "name": "content-service",
          "url": "http://content-service:3003/health",
          "method": "GET",
          "timeout": 5,
          "interval": 30,
          "retries": 3,
          "expected_status": 200,
