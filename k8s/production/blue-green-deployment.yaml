---
# Service for Blue-Green Deployment (Routes to active environment)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ailert-production
  labels:
    app: user-service
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: user-service
    version: blue # Initially routes to blue
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
  sessionAffinity: None

---
