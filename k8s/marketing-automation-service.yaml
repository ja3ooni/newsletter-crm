apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-automation-service
  namespace: ailert
  labels:
    app: marketing-automation-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketing-automation-service
  template:
    metadata:
      labels:
        app: marketing-automation-service
        version: v1
    spec:
      containers:
      - name: marketing-automation-service
        image: ailert/marketing-automation-service:latest
        ports:
        - containerPort: 3003
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3003"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "ailert_automation"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: USER_SERVICE_URL
          value: "http://user-service:3001"
        - name: CRM_SERVICE_URL
          value: "http://crm-service:3002"
        - name: NEWSLETTER_SERVICE_URL
          value: "http://newsletter-service:3004"
        - name: USER_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: service-api-keys
              key: user-service-key
        - name: CRM_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: service-api-keys
              key: crm-service-key
        - name: NEWSLETTER_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: service-api-keys
              key: newsletter-service-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      securityContext:
        fsGroup: 1001
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: marketing-automation-service
  namespace: ailert
  labels:
    app: marketing-automation-service
spec:
  selector:
    app: marketing-automation-service
  ports:
  - name: http
    port: 3003
    targetPort: 3003
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketing-automation-service-hpa
  namespace: ailert
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketing-automation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketing-automation-service-pdb
  namespace: ailert
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: marketing-automation-service
