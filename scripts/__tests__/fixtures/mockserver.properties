# MockServer configuration for developer tools testing

# Server settings
mockserver.logLevel=INFO
mockserver.serverPort=1080

# CORS settings
mockserver.enableCORSForAPI=true
mockserver.enableCORSForAllResponses=true

# Request/Response settings
mockserver.maxExpectations=1000
mockserver.maxWebSocketExpectations=1000

# Logging settings
mockserver.disableSystemOut=false

# Initialize expectations from file
mockserver.initializationJsonPath=/config/expectations.json

# Persistence settings
mockserver.persistExpectations=false

# Performance settings
mockserver.nioEventLoopThreadCount=5
mockserver.actionHandlerThreadCount=5

# Security settings
mockserver.tlsMutualAuthenticationRequired=false
